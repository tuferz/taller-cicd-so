services:
  app:
    image: ghcr.io/tuferz/taller-cicd-so:latest
    container_name: bitacora-app
    ports:
      - "5000:5000"
    volumes:
      - datos_notas:/data
    mem_limit: 128m
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-cd
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup --label-enable
    mem_limit: 64m
    restart: unless-stopped

volumes:
  datos_notas:
